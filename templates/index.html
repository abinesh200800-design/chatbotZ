<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataWise</title>
<style>
:root{--a:#2dd4bf;--b:#0f766e;--text:#182033;--muted:#687587}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui;background:linear-gradient(135deg,#eef2ff,#f8fafc);display:flex;justify-content:center;padding:22px;color:var(--text)}
.app{width:min(1050px,100%);height:calc(100vh - 44px);display:grid;grid-template-columns:235px 1fr;background:#fff;border-radius:25px;overflow:hidden;box-shadow:0 22px 65px #1e293b20}
aside{padding:25px;color:#fff;background:linear-gradient(160deg,var(--a),var(--b))}aside .logo{font-size:40px;margin-bottom:28px}aside h1{font-size:21px;margin:0 0 8px}aside p{font-size:12px;line-height:1.6;opacity:.85}.scope{margin-top:30px;padding:13px;border:1px solid #ffffff44;border-radius:14px;font-size:10px}
main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}header{padding:20px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between}header h1{margin:0;font-size:19px}header span{font-size:11px;color:var(--muted)}.status{color:#16a34a;font-size:11px}
.chat{overflow:auto;padding:28px}.welcome{max-width:620px;margin:50px auto;text-align:center}h2{font-size:38px;margin:0 0 12px}.welcome p{color:var(--muted);line-height:1.7}
.msg{display:flex;margin-bottom:16px}.user{justify-content:flex-end}.bubble{max-width:80%;padding:14px 17px;border-radius:17px;background:#f1f5f9;white-space:pre-wrap;line-height:1.6}.user .bubble{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
footer{padding:15px 20px;border-top:1px solid #e5e7eb}form{display:flex;gap:8px;border:1px solid #dbe1ea;border-radius:17px;padding:7px}textarea{flex:1;min-height:46px;border:0;outline:0;resize:none;padding:12px;font:inherit}button{width:48px;border:0;border-radius:13px;background:var(--a);color:#fff;font-size:18px;cursor:pointer}
@media(max-width:720px){body{padding:0}.app{height:100vh;border-radius:0;grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="app">
<aside><div class="logo">▦</div><h1>DataWise</h1><p>AI assistant for Data Science study.</p><div class="scope">STUDY MODE<br><br>DATA SCIENCE</div></aside>
<main>
<header>
<div class="brand"><div class="logo">▦</div><div><h1>DataWise</h1><small>Data Science study assistant</small></div></div>
<div class="pill">● STUDY MODE</div>
</header>
<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="hero">▦</div>
<h2>Learn Data Science.</h2>
<p>Ask concepts, problems, assignments, revision questions, or exam-preparation questions related to Data Science.</p>
</div>
</section>
<footer>
<form id="chat-form">
<textarea id="message" rows="1" placeholder="Ask a Data Science question..." autocomplete="off"></textarea>
<button id="send" type="submit">➤</button>
</form>
</footer>
</main>
</div>
<script>
const form=document.getElementById("chat-form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");
const welcome=document.getElementById("welcome");

function addMessage(text,role){
 if(welcome) welcome.remove();
 const row=document.createElement("div");
 row.className="msg "+role;
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;
 row.appendChild(bubble);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}

function addTyping(){
 const row=document.createElement("div");
 row.className="msg bot";
 row.id="typing";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent="Thinking...";
 row.appendChild(bubble);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message||send.disabled)return;
 addMessage(message,"user");
 input.value="";
 input.style.height="auto";
 send.disabled=true;
 addTyping();
 try{
  const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  const data=await r.json();
  document.getElementById("typing")?.remove();
  addMessage(r.ok?data.reply:(data.error||"Something went wrong."),"bot");
 }catch(err){
  document.getElementById("typing")?.remove();
  addMessage("Unable to connect to the chatbot right now.","bot");
 }finally{send.disabled=false;input.focus();}
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,140)+"px";
});
input.addEventListener("keydown",(e)=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}
});
</script>
</body>
</html>
